<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Merry Christmas, I Miss You</title>

<style>

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #03050b;
    color: white;
    font-family: Georgia, "Times New Roman", serif;
}

.scene {
    position: fixed;
    inset: 0;
    overflow: hidden;

    background:
        linear-gradient(
            to bottom,
            #02040b 0%,
            #071125 35%,
            #12213a 65%,
            #070b12 100%
        );
}


/* =========================
   STARS
========================= */

.stars {
    position: absolute;
    inset: 0;

    background-image:
        radial-gradient(
            circle,
            rgba(255,255,255,.9) 1px,
            transparent 1.5px
        ),
        radial-gradient(
            circle,
            rgba(255,255,255,.7) 1px,
            transparent 1.5px
        ),
        radial-gradient(
            circle,
            rgba(255,255,255,.5) .8px,
            transparent 1.3px
        );

    background-size:
        150px 150px,
        230px 230px,
        310px 310px;

    background-position:
        20px 30px,
        90px 120px,
        160px 70px;

    opacity: .5;

    animation:
        starMove 18s ease-in-out infinite alternate;
}

@keyframes starMove {

    from {
        transform: translateY(0);
        opacity: .35;
    }

    to {
        transform: translateY(-15px);
        opacity: .65;
    }
}


/* =========================
   MOON GLOW
========================= */

.moon-glow {
    position: absolute;

    width: 380px;
    height: 380px;

    right: 5%;
    top: 3%;

    border-radius: 50%;

    background:
        radial-gradient(
            circle,
            rgba(220,230,255,.16),
            transparent 65%
        );

    filter: blur(5px);
}


/* =========================
   MOON
========================= */

.moon {
    position: absolute;

    width: 145px;
    height: 145px;

    right: 12%;
    top: 13%;

    border-radius: 50%;

    background:
        radial-gradient(
            circle at 35% 30%,
            #ffffff,
            #e9e9dc 65%,
            #c9cbd0
        );

    box-shadow:
        0 0 25px rgba(255,255,230,.3),
        0 0 80px rgba(190,205,255,.12);

    animation:
        moonFloat 8s ease-in-out infinite alternate;
}

@keyframes moonFloat {

    from {
        transform: translateY(0);
    }

    to {
        transform: translateY(-7px);
    }
}

.moon::before,
.moon::after {
    content: "";

    position: absolute;

    border-radius: 50%;

    background: #bfc1bc;

    opacity: .18;
}

.moon::before {
    width: 30px;
    height: 30px;

    left: 30px;
    top: 35px;
}

.moon::after {
    width: 20px;
    height: 20px;

    right: 28px;
    bottom: 35px;
}


/* =========================
   MOUNTAINS
========================= */

.mountain-back {
    position: absolute;

    bottom: 23%;
    left: -10%;

    width: 120%;
    height: 35%;

    background:

        linear-gradient(
            135deg,
            transparent 49%,
            #0b1524 50%
        ) 0 100% / 42% 100% no-repeat,

        linear-gradient(
            225deg,
            transparent 49%,
            #0b1524 50%
        ) 20% 100% / 50% 100% no-repeat,

        linear-gradient(
            135deg,
            transparent 49%,
            #0c1727 50%
        ) 55% 100% / 48% 100% no-repeat;

    opacity: .9;
}

.mountain-front {
    position: absolute;

    bottom: 18%;
    left: -10%;

    width: 120%;
    height: 27%;

    background:

        linear-gradient(
            135deg,
            transparent 49%,
            #080f1b 50%
        ) 0 100% / 45% 100% no-repeat,

        linear-gradient(
            225deg,
            transparent 49%,
            #080f1b 50%
        ) 20% 100% / 55% 100% no-repeat,

        linear-gradient(
            135deg,
            transparent 49%,
            #070d17 50%
        ) 60% 100% / 45% 100% no-repeat;
}


/* =========================
   SNOW GROUND
========================= */

.ground {
    position: absolute;

    bottom: -8%;
    left: -10%;

    width: 120%;
    height: 34%;

    border-radius: 50% 50% 0 0;

    background:
        radial-gradient(
            ellipse at 50% 0%,
            #27364b 0%,
            #111b29 45%,
            #060a11 85%
        );

    box-shadow:
        0 -20px 60px rgba(170,200,240,.05);
}


/* =========================
   CABIN
========================= */

.cabin {
    position: absolute;

    bottom: 17%;
    left: 14%;

    width: 190px;
    height: 115px;

    background:
        linear-gradient(
            90deg,
            #0d0c0d,
            #171313,
            #0a090a
        );

    border: 2px solid #050505;

    box-shadow:
        0 15px 30px rgba(0,0,0,.55);
}

.roof {
    position: absolute;

    top: -60px;
    left: -22px;

    width: 0;
    height: 0;

    border-left: 117px solid transparent;
    border-right: 117px solid transparent;
    border-bottom: 68px solid #080b10;
}

.roof::after {
    content: "";

    position: absolute;

    left: -98px;
    top: 55px;

    width: 196px;
    height: 6px;

    background: #151a21;

    transform: rotate(-1deg);
}

.window {
    position: absolute;

    top: 27px;

    width: 43px;
    height: 43px;

    background:

        linear-gradient(
            90deg,
            transparent 47%,
            #5e3b18 48%,
            #5e3b18 53%,
            transparent 54%
        ),

        linear-gradient(
            0deg,
            transparent 47%,
            #5e3b18 48%,
            #5e3b18 53%,
            transparent 54%
        ),

        #e4a349;

    box-shadow:
        0 0 15px #e4a349,
        0 0 45px rgba(255,170,60,.35);

    animation:
        warmLight 3s ease-in-out infinite alternate;
}

.window.one {
    left: 22px;
}

.window.two {
    right: 22px;
}

@keyframes warmLight {

    from {
        filter: brightness(.8);
    }

    to {
        filter: brightness(1.15);
    }
}

.door {
    position: absolute;

    left: 75px;
    bottom: 0;

    width: 40px;
    height: 66px;

    background: #100d0c;
}

.door::after {
    content: "";

    position: absolute;

    width: 5px;
    height: 5px;

    right: 6px;
    top: 35px;

    border-radius: 50%;

    background: #b98a43;
}


/* =========================
   PINE TREES
========================= */

.tree {
    position: absolute;

    bottom: 17%;

    width: 0;
    height: 0;

    border-left: 38px solid transparent;
    border-right: 38px solid transparent;
    border-bottom: 115px solid #050d15;

    filter:
        drop-shadow(
            0 12px 15px rgba(0,0,0,.5)
        );
}

.tree::before {
    content: "";

    position: absolute;

    left: -30px;
    top: 45px;

    border-left: 30px solid transparent;
    border-right: 30px solid transparent;
    border-bottom: 90px solid #06101a;
}

.tree::after {
    content: "";

    position: absolute;

    left: -22px;
    top: 80px;

    border-left: 22px solid transparent;
    border-right: 22px solid transparent;
    border-bottom: 65px solid #07111b;
}

.tree.one {
    left: 3%;
    transform: scale(1.25);
}

.tree.two {
    right: 5%;
    transform: scale(1.55);
}

.tree.three {
    right: 24%;
    bottom: 18%;
    transform: scale(.8);
}

.tree.four {
    left: 28%;
    bottom: 18%;
    transform: scale(.65);
}


/* =========================
   SNOW
========================= */

.snow {
    position: absolute;

    top: -20px;

    color: white;

    pointer-events: none;

    z-index: 30;

    opacity: .7;

    animation:
        snowfall linear infinite,
        snowFade ease-in-out infinite alternate;
}

@keyframes snowfall {

    from {
        transform:
            translateY(-30px)
            translateX(0)
            rotate(0deg);
    }

    to {
        transform:
            translateY(110vh)
            translateX(80px)
            rotate(180deg);
    }
}

@keyframes snowFade {

    from {
        opacity: .2;
    }

    to {
        opacity: .85;
    }
}


/* =========================
   LYRICS
========================= */

.lyrics {
    position: absolute;

    inset: 0;

    display: flex;

    align-items: center;
    justify-content: center;

    text-align: center;

    padding: 30px;

    z-index: 40;

    pointer-events: none;
}

.line {
    position: absolute;

    width: min(900px, 90%);

    display: none;

    font-size: clamp(24px, 4vw, 46px);

    line-height: 1.4;

    letter-spacing: .2px;

    color: rgba(255,255,255,.96);

    text-shadow:
        0 2px 10px rgba(0,0,0,.9),
        0 0 25px rgba(255,255,255,.08);
}

@keyframes lyricAppear {

    0% {
        opacity: 0;

        transform:
            translateY(20px)
            scale(.97);

        filter: blur(8px);
    }

    15% {
        opacity: 1;

        transform:
            translateY(0)
            scale(1);

        filter: blur(0);
    }

    75% {
        opacity: 1;

        transform:
            translateY(-3px)
            scale(1.01);

        filter: blur(0);
    }

    100% {
        opacity: 0;

        transform:
            translateY(-20px)
            scale(1.03);

        filter: blur(7px);
    }
}

.final {
    font-size: clamp(40px, 7vw, 75px);

    letter-spacing: 4px;

    text-shadow:
        0 0 20px rgba(255,255,255,.15),
        0 0 50px rgba(150,180,255,.15);
}


/* =========================
   VIGNETTE
========================= */

.vignette {
    position: fixed;

    inset: 0;

    pointer-events: none;

    z-index: 50;

    background:
        radial-gradient(
            ellipse at center,
            transparent 38%,
            rgba(0,0,0,.7) 100%
        );
}


/* =========================
   MUSIC BUTTON
========================= */

.music-control {
    position: fixed;

    right: 25px;
    bottom: 25px;

    z-index: 100;

    width: 48px;
    height: 48px;

    border: 1px solid rgba(255,255,255,.2);

    border-radius: 50%;

    background: rgba(5,8,15,.65);

    color: white;

    cursor: pointer;

    backdrop-filter: blur(8px);

    font-size: 18px;

    transition: .3s;
}

.music-control:hover {
    background: rgba(255,255,255,.12);

    transform: scale(1.08);
}


/* =========================
   TITLE
========================= */

.title {
    position: fixed;

    bottom: 25px;
    left: 0;

    width: 100%;

    text-align: center;

    z-index: 60;

    font-family: Arial, sans-serif;

    font-size: 9px;

    letter-spacing: 5px;

    opacity: .3;
}

</style>
</head>


<body>


<!-- =========================
     SCENE
========================= -->

<div class="scene">

    <div class="stars"></div>

    <div class="moon-glow"></div>

    <div class="moon"></div>

    <div class="mountain-back"></div>

    <div class="mountain-front"></div>

    <div class="ground"></div>

    <div class="tree one"></div>
    <div class="tree two"></div>
    <div class="tree three"></div>
    <div class="tree four"></div>

    <div class="cabin">

        <div class="roof"></div>

        <div class="window one"></div>

        <div class="window two"></div>

        <div class="door"></div>

    </div>

</div>


<!-- =========================
     LYRICS
========================= -->

<div class="lyrics">

    <div class="line">
        So, what if I call
    </div>

    <div class="line">
        And you pick up the phone?
    </div>

    <div class="line">
        And I use this holiday to make my way to your ghost
    </div>

    <div class="line">
        Oh, what if you're lonely
    </div>

    <div class="line">
        And you know I am too?
    </div>

    <div class="line">
        And I get the chance to say
    </div>

    <div class="line">
        "Merry Christmas, I miss you"
    </div>

    <div class="line final">
        I miss you
    </div>

</div>


<!-- =========================
     MUSIC
========================= -->

<audio id="music" preload="auto">
    <source src="music.mp3" type="audio/mpeg">
</audio>


<button
    class="music-control"
    id="musicButton"
    aria-label="Play music">
    ▶
</button>


<div class="vignette"></div>


<div class="title">
    MERRY CHRISTMAS, I MISS YOU
</div>


<script>

/* =========================
   MUSIC
========================= */

const music =
    document.getElementById("music");

const musicButton =
    document.getElementById("musicButton");

const lines =
    document.querySelectorAll(".line");


/* =========================
   LYRIC TIMINGS
========================= */

/*
    These are starting estimates.

    Change the "time" values to match
    your specific audio file.
*/

const lyrics = [

    {
        time: 0,
        text: "So, what if I call"
    },

    {
        time: 5,
        text: "And you pick up the phone?"
    },

    {
        time: 10,
        text: "And I use this holiday to make my way to your ghost"
    },

    {
        time: 18,
        text: "Oh, what if you're lonely"
    },

    {
        time: 23,
        text: "And you know I am too?"
    },

    {
        time: 28,
        text: "And I get the chance to say"
    },

    {
        time: 34,
        text: "\"Merry Christmas, I miss you\""
    },

    {
        time: 43,
        text: "I miss you"
    }

];


let currentLyric = -1;


/* =========================
   SHOW LYRIC
========================= */

function showLyric(index) {

    lines.forEach(line => {

        line.style.display = "none";

    });


    if (index < 0) {
        return;
    }


    const line = lines[index];


    line.style.display = "block";


    /*
        Restart the animation
    */

    line.style.animation = "none";

    void line.offsetWidth;

    line.style.animation =
        "lyricAppear 5s ease-in-out forwards";

}


/* =========================
   SYNC LYRICS WITH MUSIC
========================= */

music.addEventListener(
    "timeupdate",
    () => {

        const time =
            music.currentTime;


        let lyricIndex = -1;


        for (
            let i = 0;
            i < lyrics.length;
            i++
        ) {

            if (
                time >=
                lyrics[i].time
            ) {

                lyricIndex = i;

            } else {

                break;

            }

        }


        /*
            Only change the lyric
            once.
        */

        if (
            lyricIndex !==
            currentLyric
        ) {

            currentLyric =
                lyricIndex;

            showLyric(
                currentLyric
            );

        }

    }
);


/* =========================
   PLAY / PAUSE
========================= */

musicButton.addEventListener(
    "click",
    async () => {

        if (music.paused) {

            try {

                await music.play();

                musicButton.textContent =
                    "❚❚";

            } catch (error) {

                console.log(
                    "Music error:",
                    error
                );

            }

        } else {

            music.pause();

            musicButton.textContent =
                "▶";

        }

    }
);


/* =========================
   SONG ENDED
========================= */

music.addEventListener(
    "ended",
    () => {

        currentLyric = -1;


        lines.forEach(line => {

            line.style.display =
                "none";

        });


        musicButton.textContent =
            "▶";

    }
);


/* =========================
   SNOW
========================= */

for (
    let i = 0;
    i < 110;
    i++
) {

    const snow =
        document.createElement("div");


    snow.className =
        "snow";


    snow.textContent =
        Math.random() > .45
        ? "•"
        : "✦";


    snow.style.left =
        Math.random() * 100 +
        "vw";


    snow.style.fontSize =
        3 +
        Math.random() * 10 +
        "px";


    snow.style.animationDuration =
        5 +
        Math.random() * 10 +
        "s";


    snow.style.animationDelay =
        Math.random() * 8 +
        "s";


    document
        .querySelector(".scene")
        .appendChild(snow);

}

</script>

</body>
</html>
