<script>
const music = document.getElementById("music");
const musicButton = document.getElementById("musicButton");
const lines = document.querySelectorAll(".line");

let current = -1;


/* =========================
   LYRIC TIMINGS
   Adjust these numbers if needed
========================= */

const lyrics = [
    { time: 0,  text: "So, what if I call" },
    { time: 5,  text: "And you pick up the phone?" },
    { time: 10, text: "And I use this holiday to make my way to your ghost" },
    { time: 18, text: "Oh, what if you're lonely" },
    { time: 23, text: "And you know I am too?" },
    { time: 28, text: "And I get the chance to say" },
    { time: 34, text: "\"Merry Christmas, I miss you\"" },
    { time: 43, text: "I miss you" }
];


/* =========================
   SHOW LYRIC
========================= */

function showLyric(index) {

    lines.forEach(line => {
        line.style.display = "none";
    });

    if (index < 0 || index >= lines.length) {
        return;
    }

    const line = lines[index];

    line.style.display = "block";

    line.style.animation = "none";

    void line.offsetWidth;

    line.style.animation =
        "lyricAppear 5s ease-in-out forwards";
}


/* =========================
   SYNC LYRICS TO MUSIC
========================= */

music.addEventListener("timeupdate", () => {

    const time = music.currentTime;

    let lyricIndex = -1;

    for (let i = 0; i < lyrics.length; i++) {

        if (time >= lyrics[i].time) {
            lyricIndex = i;
        } else {
            break;
        }
    }

    if (lyricIndex !== current) {

        current = lyricIndex;

        showLyric(current);
    }
});


/* =========================
   RESET WHEN SONG RESTARTS
========================= */

music.addEventListener("ended", () => {

    current = -1;

    lines.forEach(line => {
        line.style.display = "none";
    });

    music.currentTime = 0;

    music.play();
});


/* =========================
   PLAY / PAUSE BUTTON
========================= */

musicButton.addEventListener("click", async () => {

    if (music.paused) {

        try {

            await music.play();

            musicButton.textContent = "❚❚";

        } catch (error) {

            console.log("Music could not start:", error);

        }

    } else {

        music.pause();

        musicButton.textContent = "▶";
    }
});


/* =========================
   SNOW
========================= */

for (let i = 0; i < 110; i++) {

    const snow =
        document.createElement("div");

    snow.className = "snow";

    snow.textContent =
        Math.random() > 0.45 ? "•" : "✦";

    snow.style.left =
        Math.random() * 100 + "vw";

    snow.style.fontSize =
        3 + Math.random() * 10 + "px";

    snow.style.animationDuration =
        5 + Math.random() * 10 + "s";

    snow.style.animationDelay =
        Math.random() * 8 + "s";

    document
        .querySelector(".scene")
        .appendChild(snow);
}
</script>
